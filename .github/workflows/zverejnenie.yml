# Automatické zverejnenie appky na GitHub Pages.
# Spustí sa pri každej zmene vo vetve main: najprv testy, potom zostavenie a zverejnenie.
# Ak testy neprejdú (napr. zakázaný výraz), nič sa nezverejní.
name: Zverejnenie na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  zostavenie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  zverejnenie:
    needs: zostavenie
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasadenie.outputs.page_url }}
    steps:
      - id: nasadenie
        uses: actions/deploy-pages@v4
